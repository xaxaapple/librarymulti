<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Библиотека — FPS Мультиплеер</title>
<link rel="stylesheet" href="styles.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="start-overlay">
  <div id="start-box">
    <h1>Библиотека</h1>
    <p>Введите ваш никнейм, чтобы войти в 3D-мир</p>
    <input id="nickname-input" type="text" maxlength="16" placeholder="Ваш никнейм" autocomplete="off">
    <button id="start-btn">Войти в библиотеку</button>
    <p class="hint">Управление: WASD — движение, мышь — обзор, ESC — выход из режима мыши</p>
    <p id="start-error"></p>
  </div>
</div>

<div id="hud">
  <div id="crosshair">+</div>
  <div id="timer-box">
    <span id="timer-label">Время:</span>
    <span id="timer-value">00:00</span>
  </div>
  <div id="players-box">Игроков онлайн: <span id="players-count">1</span></div>
</div>

<canvas id="glitch-canvas"></canvas>

<div id="blocker-msg">Кликните по экрану, чтобы вернуться в игру</div>

<script src="app.js"></script>
</body>
</html>
